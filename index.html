<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Dashboard</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#020605;color:#00ff88;
font-family:monospace;padding:15px;
}
header{
text-align:center;padding:20px;
border:1px solid #00ff88;
box-shadow:0 0 15px #00ff8855;
}
h1{text-shadow:0 0 12px #00ff88}
.card{
background:#06140d;
border:1px solid #00ff8866;
padding:18px;margin-top:15px;
border-radius:10px;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.value{font-size:25px;color:#00ff88}
.bar{
height:10px;background:#10251a;
margin-top:10px;
}
.fill{
height:100%;width:0%;
background:#00ff88;
transition:width 1s;
}
button{
background:#00ff88;
border:0;padding:14px;
font-weight:bold;width:100%;
font-size:16px;
margin-top:15px;
}
#terminal{
height:180px;overflow:auto;
color:#00ff88;
font-size:13px;
line-height:1.8;
}
#status{color:white}
</style>
</head>

<body>

<header>
<h1>☠ CYBER DASHBOARD ☠</h1>
<p>ADVANCED SECURITY SIMULATOR</p>
<p>● SYSTEM ONLINE</p>
</header>

<div class="grid">

<div class="card">
CPU DEMO
<div class="value" id="cpu">0%</div>
<div class="bar"><div class="fill" id="cpuBar"></div></div>
</div>

<div class="card">
RAM DEMO
<div class="value" id="ram">0%</div>
<div class="bar"><div class="fill" id="ramBar"></div></div>
</div>

</div>

<div class="card">
<h3>⌨ TERMINAL</h3>
<div id="terminal">
> Dashboard initialized...<br>
> Waiting for command...
</div>
<button onclick="start()">START ANALYSIS</button>
</div>

<div class="card">
<h3>🔐 SECURITY STATUS</h3>
<p id="status">STATUS: IDLE</p>
<p>Network Demo: ONLINE</p>
<p>Firewall Demo: ACTIVE</p>
<p>Analysis: SIMULATION ONLY</p>
</div>

<script>

const terminal=document.getElementById("terminal");

let running=false;

function log(text){
terminal.innerHTML+="<br>> "+text;
terminal.scrollTop=terminal.scrollHeight;
}

function start(){

if(running)return;
running=true;

let count=0;

const messages=[
"Initializing dashboard...",
"Loading demo modules...",
"Checking simulated CPU...",
"Checking simulated memory...",
"Running sample security checks...",
"Preparing demo report...",
"Analysis completed successfully."
];

document.getElementById("status").innerText="STATUS: RUNNING";

const timer=setInterval(()=>{

count++;

let cpu=Math.floor(Math.random()*80)+10;
let ram=Math.floor(Math.random()*70)+20;

document.getElementById("cpu").innerText=cpu+"%";
document.getElementById("ram").innerText=ram+"%";

document.getElementById("cpuBar").style.width=cpu+"%";
document.getElementById("ramBar").style.width=ram+"%";

if(count<=messages.length){
log(messages[count-1]);
}

if(count>=messages.length){

clearInterval(timer);

document.getElementById("status").innerText=
"STATUS: ANALYSIS COMPLETE";

log("Demo report ready.");

running=false;
}

},1200);

}

</script>

</body>
</html>
